[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safari-ai-explorer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "earthengine-api",
    "folium",
    "geopandas",
    "ipywidgets",
    "numpy",
    "osmnx",
    "pandas",
    "pyarrow",
    "pyproj",
    "requests",
    "scipy",
    "shapely>=2",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
